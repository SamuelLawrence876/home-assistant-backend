name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  STACK_BASE_NAME: serverless-starter

jobs:
  deploy-dev:
    name: Deploy — dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap

      - name: Deploy dev stack
        run: |
          npx cdk deploy "$STACK_BASE_NAME-dev" \
            --require-approval never \
            -c stackType=dev

  deploy-prod:
    name: Deploy — production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap

      - name: Deploy production stack
        run: |
          npx cdk deploy "$STACK_BASE_NAME" \
            --require-approval never \
            -c stackType=prod
