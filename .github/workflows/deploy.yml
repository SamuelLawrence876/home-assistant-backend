name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  STACK_BASE_NAME: home-assistant

jobs:
  deploy-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap

      - name: Deploy production stack
        run: |
          npx cdk deploy "$STACK_BASE_NAME" \
            --require-approval never \
            -c stackType=prod \
            --outputs-file cdk-outputs.json

      - name: Extract API URL
        id: outputs
        run: echo "api-url=$(jq -r '.[keys[0]].ApiUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Run acceptance tests
        run: npm run test:acceptance
        env:
          API_URL: ${{ steps.outputs.outputs.api-url }}
