name: Deploy — Production

# Deploys the production stack (no stage suffix) on push to main.
# Push a semver tag (v*) to trigger a versioned production release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

env:
  STACK_BASE_NAME: serverless-starter  # must match the default in infrastructure/bin/app.ts

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap

      # No -c stage flag → bin/app.ts uses base stackName → "serverless-starter"
      - name: Deploy production stack
        run: npx cdk deploy "$STACK_BASE_NAME" --require-approval never
